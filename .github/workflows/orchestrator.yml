name: Comic Orchestrator
on:
  workflow_run:
    workflows: ["Comic Pipeline"]
    types: [completed]
permissions:
  contents: write
  actions: write
jobs:
  dispatch-next:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Determine completed slot and dispatch next queued case
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          echo "Completed run $RUN_ID conclusion=$RUN_CONCLUSION"
          SLOT=$(gh run view "$RUN_ID" --log 2>/dev/null | grep -o "Kaggle account: slot [A-Za-z0-9()]* =" | head -1 | sed 's/Kaggle account: slot //; s/ =//' | xargs || true)
          if [ "$SLOT" = "(blank)" ]; then SLOT=""; fi
          echo "Completed run used slot: '$SLOT'"
          NEXT=$(python3 orchestrator/pop.py "$SLOT")
          if [ -z "$NEXT" ]; then
            echo "Nothing to dispatch for slot '$SLOT'."
            exit 0
          fi
          CASE=$(echo "$NEXT" | cut -d'|' -f1)
          ISSUE=$(echo "$NEXT" | cut -d'|' -f2)
          PROFILE=$(echo "$NEXT" | cut -d'|' -f3)
          PAGES=$(echo "$NEXT" | cut -d'|' -f4)
          echo "Dispatching #$ISSUE ($CASE) profile=$PROFILE pages=$PAGES slot='$SLOT'"
          git config user.name "comic-orchestrator"
          git config user.email "orchestrator@shadow-gasp"
          git add orchestrator/queue.json orchestrator/budgets.json
          git commit -m "orchestrator: dispatch issue #$ISSUE, decrement slot '$SLOT' budget"
          git push
          if [ -z "$SLOT" ]; then
            gh workflow run "Comic Pipeline" -f case="$CASE" -f target_pages="$PAGES" -f issue_no="$ISSUE" -f profile="$PROFILE"
          else
            gh workflow run "Comic Pipeline" -f case="$CASE" -f target_pages="$PAGES" -f issue_no="$ISSUE" -f profile="$PROFILE" -f kaggle_account="$SLOT"
          fi
