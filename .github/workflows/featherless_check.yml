name: Featherless key check (temporary)
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - env:
          FEATHERLESS_API_KEY: ${{ secrets.FEATHERLESS_API_KEY }}
        run: |
          cd pipeline_lib
          python llm.py list-models featherless > /tmp/models.txt
          echo "total: $(wc -l < /tmp/models.txt)"
          grep -iE "^(meta-llama/(Meta-)?Llama-3\.[13]-70B-Instruct|Qwen/Qwen2\.5-72B-Instruct|mistralai/Mistral-(Small|Large)-Instruct|deepseek-ai/DeepSeek-V3|Qwen/Qwen2\.5-32B-Instruct)$" /tmp/models.txt || echo "none of the preferred exact ids matched"
          echo "---close matches---"
          grep -iE "llama-3\.[13]-70b-instruct$|qwen2\.5-72b-instruct$|mistral-small.*instruct" /tmp/models.txt | grep -v Gensyn | head -30
