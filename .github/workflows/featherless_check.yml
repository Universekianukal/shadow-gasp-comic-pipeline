name: Featherless key check (temporary)
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - env:
          FEATHERLESS_API_KEY: ${{ secrets.FEATHERLESS_API_KEY }}
        run: |
          cd pipeline_lib
          python - <<'PYEOF'
import sys
sys.path.insert(0, ".")
import llm as LLM
c = LLM.LLM(provider="featherless", model="meta-llama/Llama-3.3-70B-Instruct")
print(f"provider={c.provider} model={c.model}")
print(c.text("Name three components in a simple LED torch circuit. No preamble.", max_tokens=300).strip()[:500])
PYEOF
