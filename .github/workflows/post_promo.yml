name: Post Comic Promo

# Deliberately manual, and deliberately two-stage.
#
# mode=preview resolves the product, picks the cover and builds the caption, then sends the
# ACTUAL IMAGE to Telegram with Accept/Reject buttons. Nothing is published. mode=post is what
# the Accept button dispatches.
#
# Why a preview at all: the image that goes out is chosen by shape from five Gumroad covers,
# and the caption is assembled from the storefront copy. Publishing either without seeing it
# means finding out on the page. The same reasoning as rendering a PDF and looking at it
# rather than trusting that the text extracted correctly.
#
# Why never automatic: a comic gets REBUILT -- price change, art regen, re-render -- and a
# post-per-build would re-post the same book. That is the pattern that took this page's reach
# from ~700-1,300 to 1 on 2026-08-10 and had to be cleaned up by hand.

on:
  workflow_dispatch:
    inputs:
      case:
        description: "Case name, Gumroad permalink, or product id"
        required: true
      platform:
        description: "fb or ig"
        required: false
        default: "fb"
      mode:
        description: "preview (send a draft to Telegram) or post (publish it)"
        required: false
        default: "preview"
      hook:
        description: "Override the opening line (blank = the product description's opening)"
        required: false
        default: ""
      force:
        description: "Publish again even though this comic already went out on this platform"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  promo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Pillow measures each candidate cover: Instagram refuses anything outside 0.80-1.91,
      # and three of the five covers on a comic fall outside it.
      - name: Install deps
        run: pip install Pillow

      - name: Install Gumroad CLI
        run: curl -fsSL https://gumroad.com/install-cli.sh | bash

      - name: Authenticate Gumroad CLI
        run: echo "${{ secrets.GUMROAD_ACCESS_TOKEN }}" | ~/.local/bin/gumroad auth login --non-interactive

      - name: Resolve and (maybe) publish
        id: run
        env:
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: |
          export PATH="$PATH:/home/runner/.local/bin"
          python pipeline_lib/post_fb_promo.py \
            --case "${{ github.event.inputs.case }}" \
            --platform "${{ github.event.inputs.platform || 'fb' }}" \
            --preview-out /tmp/preview.json \
            ${{ github.event.inputs.hook && format('--hook "{0}"', github.event.inputs.hook) || '' }} \
            ${{ github.event.inputs.force == 'true' && '--force' || '' }} \
            ${{ github.event.inputs.mode != 'post' && '--dry-run' || '' }}

      - name: Send the draft to Telegram
        if: always() && github.event.inputs.mode != 'post'
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          WORKER_SHARED_SECRET: ${{ secrets.WORKER_SHARED_SECRET }}
          OUTCOME: ${{ steps.run.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ ! -f /tmp/preview.json ]; then
            echo '{}' > /tmp/preview.json
          fi
          python3 - <<'PY' > /tmp/payload.json
          import json, os
          p = json.load(open("/tmp/preview.json", encoding="utf-8"))
          p["outcome"] = os.environ["OUTCOME"]
          p["run_url"] = os.environ["RUN_URL"]
          print(json.dumps(p))
          PY
          # A browser User-Agent: urllib/curl defaults are refused at Cloudflare's edge (1010),
          # so the Worker never sees the call and its log stays empty.
          curl -sS -X POST "${WORKER_URL%/}/promo/preview" \
            -H "Content-Type: application/json" \
            -H "X-Shared-Secret: ${WORKER_SHARED_SECRET}" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            --data @/tmp/payload.json \
            || echo "WARNING: could not send the draft"

      - name: Commit the posted marker
        if: github.event.inputs.mode == 'post'
        run: |
          # The marker is what stops a rebuild re-posting the book, so it must outlive the
          # runner. It is names, ids and timestamps only -- safe in this public repo for the
          # same reason the case ledger is.
          git config user.name "shadow-gasp-bot"
          git config user.email "bot@shadowgasp.example"
          git add promo/ 2>/dev/null || true
          git commit -m "promo: ${{ github.event.inputs.platform }} <- ${{ github.event.inputs.case }}" || {
            echo "nothing to commit"; exit 0; }
          git pull --rebase --autostash origin main || true
          git push

      - name: Report the result
        if: always() && github.event.inputs.mode == 'post'
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          WORKER_SHARED_SECRET: ${{ secrets.WORKER_SHARED_SECRET }}
          CASE: ${{ github.event.inputs.case }}
          PLATFORM: ${{ github.event.inputs.platform }}
          RESULT: ${{ steps.run.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 -c 'import json,os;print(json.dumps({"case":os.environ["CASE"],"platform":os.environ["PLATFORM"],"result":os.environ["RESULT"],"run_url":os.environ["RUN_URL"]}))' > /tmp/done.json
          curl -sS -X POST "${WORKER_URL%/}/promo/posted" \
            -H "Content-Type: application/json" \
            -H "X-Shared-Secret: ${WORKER_SHARED_SECRET}" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            --data @/tmp/done.json \
            || echo "WARNING: could not report the result"
