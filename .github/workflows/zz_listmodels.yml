name: zz listmodels (temporary)
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install requests
      - name: chunked 75pp live test (script only, no cache)
        env:
          FEATHERLESS_API_KEY: ${{ secrets.FEATHERLESS_API_KEY }}
          COMIC_LLM_PROVIDER: featherless
        run: |
          mkdir -p out
          ( time python pipeline_lib/gen_case_script.py --out-dir out --case "The Dyatlov Pass incident (Ural Mountains, 1959)" --issue-no 999 --target-pages 75 --profile classic ) 2>&1 | tee out/log.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: chunk75, path: out}
