name: Model bakeoff (temporary)
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - name: dslist
        env:
          FEATHERLESS_API_KEY: ${{ secrets.FEATHERLESS_API_KEY }}
        run: |
          cd pipeline_lib
          python llm.py list-models featherless | grep -iE "deepseek-v3|deepseek-ai/DeepSeek-V3"
