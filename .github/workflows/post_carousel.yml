name: Post Comic Carousel (Instagram / Facebook)

# Dispatched by the comics bot's /carousel draft "Post" buttons -- never automatic. The slides and
# caption are already committed (carousel/index.json); this only publishes them, writes the
# per-platform posted marker (stops an accidental second copy), and reports back so a COMIC comment
# on the new post gets routed by the DM funnel.
#   ig = swipeable Instagram carousel
#   fb = one Facebook multi-photo post (Pages have no swipe carousel for photos)

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "carousel slug from carousel/index.json (e.g. norjak)"
        required: true
      platform:
        description: "ig (Instagram) or fb (Facebook)"
        required: false
        default: "ig"
      force:
        description: "post again even though this carousel already went out on this platform"
        required: false
        default: "false"
      dry_run:
        description: "check slides + token only, post nothing"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: post-carousel-${{ github.event.inputs.slug }}
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Publish the carousel
        id: run
        env:
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: |
          python pipeline_lib/post_ig_carousel.py --slug "${{ github.event.inputs.slug }}" \
            --platform "${{ github.event.inputs.platform == 'fb' && 'fb' || 'ig' }}" \
            ${{ github.event.inputs.force == 'true' && '--force' || '' }} \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

      - name: Commit the posted marker
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "shadow-gasp-bot"
          git config user.email "bot@shadowgasp.example"
          git add carousel/*.posted.json 2>/dev/null || true
          git commit -m "carousel: ${{ github.event.inputs.platform || 'ig' }} <- ${{ github.event.inputs.slug }}" || { echo "nothing to commit"; exit 0; }
          git pull --rebase --autostash origin main || true
          git push

      - name: Report the result
        if: always()
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          WORKER_SHARED_SECRET: ${{ secrets.WORKER_SHARED_SECRET }}
          SLUG: ${{ github.event.inputs.slug }}
          PLATFORM: ${{ github.event.inputs.platform == 'fb' && 'fb' || 'ig' }}
          RESULT: ${{ steps.run.outcome }}
          DRY: ${{ github.event.inputs.dry_run }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 -c 'import json,os;p="/tmp/car_posted.json";d=json.load(open(p)) if os.path.exists(p) else {};d.update(slug=os.environ["SLUG"],platform=os.environ["PLATFORM"],outcome=os.environ["RESULT"],dry_run=os.environ["DRY"],run_url=os.environ["RUN_URL"]);print(json.dumps(d))' > /tmp/done.json
          curl -sS -X POST "${WORKER_URL%/}/carousel/posted" \
            -H "Content-Type: application/json" \
            -H "X-Shared-Secret: ${WORKER_SHARED_SECRET}" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            --data @/tmp/done.json \
            || echo "WARNING: could not report the result"

      # ---- failure alert (added 2026-09-19) ----
      # The autopilot now dispatches this unattended, so a failure has to
      # announce itself. "Report the result" above tells the Worker the
      # outcome; this guarantees a Telegram message regardless of what the
      # Worker chooses to do with it.
      #
      # Purely additive: runs only on failure, so every successful path is
      # exactly what it was.
      - name: Tell Telegram this FAILED
        if: failure()
        continue-on-error: true
        env:
          BOT: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SLUG: ${{ github.event.inputs.slug }}
          PLATFORM: ${{ github.event.inputs.platform || 'ig' }}
          MSG: "🔴 Comic carousel FAILED to post to ${{ github.event.inputs.platform || 'ig' }} for ${{ github.event.inputs.slug }}. Nothing went out and no posted-marker was written, so it stays in the queue and the autopilot will retry it."
        run: |
          # Built in python so a slug or error text carrying a quote cannot
          # break the payload, and Telegram's own ok flag is checked -- curl
          # -sS exits 0 on a 403 too, which would turn a lost alert green.
          T="$MSG Log: $RUN_URL"             python3 -c 'import json,os;print(json.dumps({"chat_id":os.environ["CHAT"],"text":os.environ["T"]}))' > tgfail.json
          curl -sS -X POST "https://api.telegram.org/bot$BOT/sendMessage"             -H "Content-Type: application/json" --data @tgfail.json -o tgfail_resp.json             || echo "WARNING: could not reach Telegram"
          python3 -c 'import json;d=json.load(open("tgfail_resp.json"));print("alert delivered, message_id",d["result"]["message_id"]) if d.get("ok") else print("WARNING: telegram refused the alert:",d)'             2>/dev/null || echo "WARNING: unreadable Telegram response"
