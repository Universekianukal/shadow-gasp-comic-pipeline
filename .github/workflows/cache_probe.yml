name: script cache probe

# Temporary diagnostic: prove whether Actions can round-trip the script cache through the
# Worker. /register writes to the same KV with the same secret and works, but zero
# script_cache: keys have ever appeared, so the save is failing silently somewhere.
# Delete this workflow once the cause is found.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Round-trip a small and a realistic payload
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          WORKER_SHARED_SECRET: ${{ secrets.WORKER_SHARED_SECRET }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error

          url = os.environ["WORKER_URL"].rstrip("/")
          sec = os.environ["WORKER_SHARED_SECRET"]
          print("worker url host:", urllib.parse.urlparse(url).netloc)

          def post(path, payload, ua=None):
              h = {"Content-Type": "application/json", "X-Shared-Secret": sec}
              if ua:
                  h["User-Agent"] = ua
              req = urllib.request.Request(
                  f"{url}{path}", data=json.dumps(payload).encode(), headers=h, method="POST")
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      return r.status, r.read()[:200]
              except urllib.error.HTTPError as e:
                  return e.code, e.read()[:300]
              except Exception as e:
                  return "EXC", repr(e)[:300]

          tiny = {"script": {"pages": [1]}, "panel_prompts": [{"file": "a.jpg"}]}
          UA = "shadow-gasp-comic-pipeline"
          print("noUA  save:", post("/script-cache/save", {"key": "probe:tiny", **tiny}))
          print("withUA save:", post("/script-cache/save", {"key": "probe:tiny", **tiny}, ua=UA))
          print("withUA get :", post("/script-cache/get", {"key": "probe:tiny"}, ua=UA))

          # Realistic size: a 154-panel script is a few hundred KB.
          big = {"script": {"pages": [{"n": i, "text": "x" * 400} for i in range(200)]},
                 "panel_prompts": [{"file": f"p{i}.jpg", "prompt": "y" * 300} for i in range(160)]}
          payload = json.dumps({"key": "probe:big", **big})
          print("big payload bytes:", len(payload))
          print("big   save:", post("/script-cache/save", {"key": "probe:big", **big}, ua=UA))
          print("big   get :", post("/script-cache/get", {"key": "probe:big"}, ua=UA))
          PY
