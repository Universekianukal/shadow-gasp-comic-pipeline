name: Comic Pipeline

permissions:
  contents: write

on:
  # ⛔ MANUAL ONLY -- the daily schedule is deliberately OFF (2026-09-02, user's call).
  #
  # Every unattended run spends real money and quota: a Fireworks script call, ~2 hours of the
  # weekly Kaggle GPU budget, and a Gumroad draft. The art still needs a human to look at it --
  # the OCR gate cannot see the defect it exists for -- so a book nobody reviews is cost without
  # product. Build on demand instead: /make in Telegram, or
  #   gh workflow run "Comic Pipeline" -f case="..." -f target_pages=35
  #
  # To turn the daily draft back on, uncomment these two lines. 22:30 UTC = 04:00 IST next day,
  # so the draft is waiting in the morning; expect ~75 minutes of GitHub queue lag on this repo.
  # schedule:
  #   - cron: "30 22 * * *"

  workflow_dispatch:
    inputs:
      case:
        description: "Case name (leave blank to auto-pick the next one)"
        required: false
        default: ""
      dry_run:
        description: "If true, stop after picking the case (no generation, no publish)"
        required: false
        default: "false"
      target_pages:
        description: "Target story page count (used by the Increase Pages flow)"
        required: false
        default: "25"
      case_source:
        description: "Where an auto-picked case comes from: upcoming (short not out yet - comic lands with its launch), published (short already live, no comic yet), new (never covered)"
        required: false
        default: "published"
      lead:
        description: "For case_source=upcoming: 0 = the next short due, 1 = the one after it. Raise it if the next short publishes sooner than a comic can be reviewed."
        required: false
        default: "0"
      # Plain string, not `type: choice`: a choice list needs a non-empty default, and "no
      # override" has to be expressible. An unknown name is rejected by layout_profiles with
      # the list of valid ones, before any Anthropic or Kaggle spend.
      regen_panels:
        description: "Panel files to force re-roll, e.g. 'p05_3 p06_1' (from the OCR contact sheets)"
        required: false
        default: ""
      profile:
        description: "Page layout style: chamber|cinematic|classic|documentary|mosaic|staccato (blank = auto, derived from the case id)"
        required: false
        default: ""
      # ~2 hours of GPU per build against a 30h/week PER-ACCOUNT Kaggle quota. Naming the
      # account spreads books across accounts instead of starving one.
      #
      # ⚠️ NOT a free per-build choice. THE KERNEL IS THE ONLY ART STORE -- cases/ is rm -rf'd
      # after every run, so a case's panels survive only as Kaggle kernel output, and
      # list_case_kernels() searches ONLY the account it is given. Rebuilding a book on a
      # different account finds nothing, prints "generating from scratch", and re-renders every
      # panel at a new seed, discarding art that was already approved. So a case is PINNED to
      # whichever account first built it; the caller is responsible for passing that same slot
      # every time. The Telegram Worker records the pin next to the issue number.
      #
      # Slots are single uppercase letters resolved dynamically from the secrets context, so a
      # fourth account is two new secrets and no edit here. Blank = the original
      # KAGGLE_USERNAME / KAGGLE_API_TOKEN pair, which is what every pre-existing book used.
      kaggle_account:
        description: "Kaggle account slot: blank = original pair, or A/B/C (needs KAGGLE_<slot>_USERNAME + KAGGLE_<slot>_API_TOKEN)"
        required: false
        default: ""
      # The issue number is normally assigned INSIDE the build (issue_registry.assign) and only
      # committed back at the very end, 2-3 hours later -- so two builds started in that window
      # both read the same issues.json and are both handed the same number, which is then baked
      # into the PDF and the Gumroad title. Passing it in lets the Telegram Worker assign it at
      # the moment of the tap instead, against a single authority, before anything dispatches.
      # "auto" keeps the old in-build behaviour, which is still the fallback for `gh workflow
      # run` and for a Worker that cannot write to issues.json.
      issue_no:
        description: "Issue number to use, or 'auto' to take the next one from issues.json"
        required: false
        default: "auto"

jobs:
  build:
    runs-on: ubuntu-latest
    # Job-level so both Kaggle steps resolve the same account -- they used to name the secrets
    # separately, which is two places for the pair to disagree.
    #
    # `secrets[format(...)]` indexes the secrets context by name, so slots need no per-account
    # branch here. GitHub expressions have no ternary; `cond && A || B` is the idiom. A slot
    # whose secrets are missing indexes to an empty string and falls through to the original
    # pair -- which would silently build on the WRONG account, so the step below refuses to
    # continue unless the resolved username matches what the slot asked for.
    env:
      KAGGLE_USERNAME: ${{ github.event.inputs.kaggle_account != '' && secrets[format('KAGGLE_{0}_USERNAME', github.event.inputs.kaggle_account)] || secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ github.event.inputs.kaggle_account != '' && secrets[format('KAGGLE_{0}_API_TOKEN', github.event.inputs.kaggle_account)] || secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # A build spends ~2h of one account's weekly GPU budget, and because the username is a
      # masked secret nothing in the log says which account paid. Two failure modes are worth
      # catching in 5 seconds rather than 40 minutes deep in the Kaggle push:
      #
      #   1. the slot's secrets do not exist -- the expression above yields "" and falls back to
      #      the primary, so the build would quietly spend the wrong quota AND write this case's
      #      art to an account the pin does not name;
      #   2. a typo'd slot ("b" vs "B", "alt") does the same thing just as quietly.
      #
      # KAGGLE_ACCOUNTS maps slot -> handle in plain text (a username is not a secret), which
      # gives us something to compare the resolved credential against. Without it we can only
      # check for emptiness, which case 1 above already defeats.
      - name: Confirm the Kaggle account resolved
        env:
          SLOT: ${{ github.event.inputs.kaggle_account }}
          ACCOUNT_MAP: ${{ vars.KAGGLE_ACCOUNTS }}
        run: |
          if [ -z "$KAGGLE_USERNAME" ] || [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "::error::kaggle_account='${SLOT:-<blank>}' resolved to an empty credential. Add KAGGLE_${SLOT}_USERNAME and KAGGLE_${SLOT}_API_TOKEN, or leave kaggle_account blank."
            exit 1
          fi
          if [ -n "$SLOT" ] && [ -n "$ACCOUNT_MAP" ]; then
            WANT=$(printf '%s' "$ACCOUNT_MAP" | tr ',' '\n' | awk -F: -v s="$SLOT" '$1==s{print $2}')
            if [ -z "$WANT" ]; then
              echo "::error::Slot '$SLOT' is not listed in the KAGGLE_ACCOUNTS variable ($ACCOUNT_MAP). Refusing to guess which account to spend."
              exit 1
            fi
            if [ "$WANT" != "$KAGGLE_USERNAME" ]; then
              echo "::error::Slot '$SLOT' should be '$WANT' but the secrets resolved to a different account. KAGGLE_${SLOT}_USERNAME is probably missing, so it fell back to the primary pair. Refusing to build this case on the wrong account -- its art store lives with the pin."
              exit 1
            fi
            echo "Kaggle account: slot $SLOT = $WANT"
          else
            # The blank slot is the original pair, which every pre-existing book was built on.
            # It is checked too, against the "-" entry: if that secret is ever rotated to a
            # different account, every unpinned rebuild would start looking for its art in a
            # place it was never written, and the only symptom is "generating from scratch".
            WANT=$(printf '%s' "$ACCOUNT_MAP" | tr ',' '\n' | awk -F: '$1=="-"{print $2}')
            if [ -n "$WANT" ] && [ "$WANT" != "$KAGGLE_USERNAME" ]; then
              echo "::error::The default KAGGLE_USERNAME is not '$WANT' as KAGGLE_ACCOUNTS claims. Either the secret was rotated or the map is stale -- fix one to match the other before building, or existing books will not find their art."
              exit 1
            fi
            echo "Kaggle account: default pair${WANT:+ = $WANT}"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        # kaggle pinned to 2.2.2: unpinned installs pick up a later release
        # whose CLI switched to a KAGGLE_API_TOKEN auth flow and silently
        # fails auth with the legacy KAGGLE_USERNAME/KAGGLE_KEY kaggle.json
        # pair, even on this pinned version -- same gotcha already hit and
        # fixed on the shadow_gasp video pipeline. Auth is via KAGGLE_API_TOKEN
        # env var directly on the steps that call the CLI, no kaggle.json.
        run: pip install requests rapidocr-onnxruntime "kaggle==2.2.2" Pillow reportlab PyMuPDF

      - name: Install Gumroad CLI
        run: curl -fsSL https://gumroad.com/install-cli.sh | bash

      - name: Authenticate Gumroad CLI
        run: echo "${{ secrets.GUMROAD_ACCESS_TOKEN }}" | ~/.local/bin/gumroad auth login --non-interactive

      - name: Pick case
        id: pick
        if: github.event.inputs.case == ''
        env:
          # `auto` = Anthropic while it has credit, Fireworks when it refuses for billing.
          # Only --source new spends anything here; the default (published) is a ledger
          # lookup and needs no key at all.
          COMIC_LLM_PROVIDER: ${{ vars.COMIC_LLM_PROVIDER_PICK || 'auto' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
        run: python pipeline_lib/pick_case.py --source "${{ github.event.inputs.case_source || vars.COMIC_DAILY_SOURCE || 'published' }}" --lead "${{ github.event.inputs.lead || '0' }}"

      - name: Set case variable
        id: case
        run: |
          if [ -n "${{ github.event.inputs.case }}" ]; then
            echo "case=${{ github.event.inputs.case }}" >> "$GITHUB_OUTPUT"
          else
            echo "case=${{ steps.pick.outputs.case }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Stop here if dry run
        if: github.event.inputs.dry_run == 'true'
        run: |
          echo "DRY RUN — picked case: ${{ steps.case.outputs.case }}"
          echo "Stopping before generation/publish, as requested."
          exit 0

      - name: Generate script + panel prompts
        id: script
        if: github.event.inputs.dry_run != 'true'
        env:
          # Anthropic ran out of credits mid-build and stopped the pipeline dead. Fireworks is
          # the fallback: pipeline_lib/llm.py caps reasoning_effort and escalates the budget on
          # truncation, which is what makes glm-5p2 terminate on this prompt. Set
          # COMIC_LLM_PROVIDER to "anthropic" to switch back once credits are topped up.
          COMIC_LLM_PROVIDER: ${{ vars.COMIC_LLM_PROVIDER || 'fireworks' }}
          # Per-call overrides. Both blank = both calls use COMIC_LLM_PROVIDER above. Set these
          # only to split the work, e.g. the model that reliably returns valid JSON writing the
          # script while the one with better art direction writes the prompts.
          COMIC_SCRIPT_PROVIDER: ${{ vars.COMIC_SCRIPT_PROVIDER }}
          COMIC_PROMPTS_PROVIDER: ${{ vars.COMIC_PROMPTS_PROVIDER }}
          COMIC_SPLIT_GENERATION: ${{ vars.COMIC_SPLIT_GENERATION || 'true' }}
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CASE: ${{ steps.case.outputs.case }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          WORKER_SHARED_SECRET: ${{ secrets.WORKER_SHARED_SECRET }}
        run: |
          SLUG=$(echo "$CASE" | tr '[:upper:] ' '[:lower:]-' | tr -cd 'a-z0-9-' | cut -c1-40)
          mkdir -p cases/$SLUG/panels
          echo "slug=$SLUG" >> "$GITHUB_ENV"
          python pipeline_lib/gen_case_script.py --out-dir cases/$SLUG --case "$CASE" --case-id "$SLUG" --target-pages "${{ github.event.inputs.target_pages || vars.COMIC_DAILY_PAGES || '25' }}" --profile "${{ github.event.inputs.profile || vars.COMIC_DAILY_PROFILE }}" --issue-no "${{ github.event.inputs.issue_no || 'auto' }}"

      # Solve the page layout BEFORE any art is generated, and write each panel's real
      # target_px back onto its prompt. Without this, gen_flux_kaggle falls back to one fixed
      # size per shape name (LANDSCAPE is always 1280x720), while the page solver derives a
      # cell's actual aspect from its tier and neighbours. The mismatch is what leaves empty
      # space in finished pages and forces panels to be regenerated on Kaggle -- the single
      # biggest source of wasted GPU time on the Heaven's Gate build.
      - name: Fit panel sizes to the page layout
        id: spec
        if: github.event.inputs.dry_run != 'true'
        run: |
          # Find the script rather than assuming issue 01. Issue numbers are assigned
          # automatically now, so the file is script_issue<NN>.json -- hardcoding 01 broke the
          # moment POISONED GROUND became issue 03. stage_and_deliver already globs for it;
          # this was the last place that did not.
          SCRIPT=$(ls cases/${{ env.slug }}/script_issue*.json | head -1)
          echo "using script: $SCRIPT"
          python pipeline_lib/spec_panels.py \
            --script "$SCRIPT" \
            --prompts cases/${{ env.slug }}/panel_prompts.json \
            --sheet cases/${{ env.slug }}/spec_panels.md

      - name: Generate FLUX art on Kaggle
        id: flux
        if: github.event.inputs.dry_run != 'true'
        env:
          # KAGGLE_USERNAME / KAGGLE_API_TOKEN come from the JOB-level env above, which honours
          # the kaggle_account input. Re-declaring them here would shadow that and pin every
          # build to the primary account while the picker still claimed otherwise.
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          # Blank = base FLUX. Set the repo variable to a private HF repo holding
          # sgnoir_lora_v1.safetensors to render in the trained house style instead. Loading is
          # non-fatal in the kernel: bitsandbytes 4-bit and PEFT adapters do not always compose,
          # and a book in the base look beats a run that dies at panel zero.
          SGNOIR_LORA_REPO: ${{ vars.SGNOIR_LORA_REPO }}
          SGNOIR_LORA_TRIGGER: ${{ vars.SGNOIR_LORA_TRIGGER || 'sgnoir style' }}
        run: python pipeline_lib/gen_flux_kaggle.py --case-dir cases/${{ env.slug }} --kaggle-user "$KAGGLE_USERNAME" --slug "${{ env.slug }}-flux" --regen "${{ github.event.inputs.regen_panels }}"

      - name: OCR check + one auto-fix retry
        id: ocr
        if: github.event.inputs.dry_run != 'true'
        # NEVER fatal. This step is optional polish that re-rolls flagged panels on a second
        # Kaggle kernel, and it is blind to the garbled text it exists to catch anyway -- the
        # human reading the Telegram draft is the real gate. On 2026-09-01 that second kernel
        # errored AFTER all 154 panels had generated successfully, and because the cleanup step
        # rm -rf's cases/ unconditionally, two hours of GPU and a complete book were deleted by
        # a failed retry. Build the PDF from the art we have instead.
        continue-on-error: true
        # Kaggle credentials come from the job-level env, so the auto-fix kernel lands on the
        # same account that generated the art.
        run: |
          cd pipeline_lib
          python ocr_autofix.py --case-dir ../cases/${{ env.slug }} --kaggle-user "$KAGGLE_USERNAME" --slug "${{ env.slug }}"

      - name: Copy shared build engine into case dir
        if: github.event.inputs.dry_run != 'true'
        run: |
          cp pipeline_lib/build_comic.py pipeline_lib/lettering.py pipeline_lib/frontback.py cases/${{ env.slug }}/
          cp -r fonts cases/${{ env.slug }}/fonts

      - name: Build PDF, stage Gumroad draft, deliver to Telegram
        id: deliver
        if: github.event.inputs.dry_run != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          WORKER_SHARED_SECRET: ${{ secrets.WORKER_SHARED_SECRET }}
        run: |
          python pipeline_lib/stage_and_deliver.py \
            --case-dir cases/${{ env.slug }} \
            --case-id "${{ env.slug }}" \
            --title "${{ steps.case.outputs.case }}" \
            --target-pages "${{ github.event.inputs.target_pages || vars.COMIC_DAILY_PAGES || '25' }}" \
            --video-id "${{ steps.pick.outputs.video_id }}"

      # Tell the user WHICH step broke, and offer a one-tap retry.
      #
      # A failed run used to be silent -- you found out by not receiving a comic. Retrying is
      # cheap by design: the script comes back from the Worker's KV cache and the art from the
      # completed Kaggle kernel, so a retry resumes at the first thing that actually failed
      # instead of re-paying for everything before it.
      - name: Report failure to Telegram
        if: failure()
        continue-on-error: true
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          WORKER_SHARED_SECRET: ${{ secrets.WORKER_SHARED_SECRET }}
          CASE: ${{ steps.case.outputs.case }}
          PAGES: ${{ github.event.inputs.target_pages || vars.COMIC_DAILY_PAGES || '25' }}
          PROFILE: ${{ github.event.inputs.profile || vars.COMIC_DAILY_PROFILE }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          C_PICK: ${{ steps.pick.conclusion }}
          C_SCRIPT: ${{ steps.script.conclusion }}
          C_SPEC: ${{ steps.spec.conclusion }}
          C_FLUX: ${{ steps.flux.conclusion }}
          C_OCR: ${{ steps.ocr.conclusion }}
          C_DELIVER: ${{ steps.deliver.conclusion }}
        run: |
          STEP="an unknown step"
          [ "$C_PICK" = "failure" ]    && STEP="picking the case"
          [ "$C_SCRIPT" = "failure" ]  && STEP="script + panel prompts"
          [ "$C_SPEC" = "failure" ]    && STEP="fitting panel sizes"
          [ "$C_FLUX" = "failure" ]    && STEP="FLUX art on Kaggle"
          [ "$C_OCR" = "failure" ]     && STEP="OCR check"
          [ "$C_DELIVER" = "failure" ] && STEP="building the PDF / Gumroad / Telegram"
          echo "failed at: $STEP"
          # ⚠️ EXPORT. STEP was a plain shell variable, so the inline python3 -- a separate
          # process -- could not see it and died with KeyError: 'STEP'. The payload was never
          # built and the retry button never arrived: a failed build stayed as silent as it had
          # been before the button was written.
          export STEP
          python3 -c 'import json,os;print(json.dumps({"case":os.environ["CASE"],"step":os.environ["STEP"],"target_pages":os.environ["PAGES"],"profile":os.environ["PROFILE"],"run_url":os.environ["RUN_URL"]}))' > /tmp/failed.json
          cat /tmp/failed.json
          # A browser User-Agent as insurance. NOTE: tested afterwards, the descriptive UA was
          # NOT the problem here -- it still reaches the Worker. The "error code: 1101" was a
          # CONSEQUENCE of the KeyError above: python3 died, --data got an empty string, and the
          # malformed request was rejected. Kept because the Python notify paths genuinely were
          # blocked at the edge (1010), and one UA rule across every caller is easier to hold in
          # mind than a per-caller exception.
          curl -sS -X POST "${WORKER_URL%/}/build-failed" \
            -H "Content-Type: application/json" \
            -H "X-Shared-Secret: ${WORKER_SHARED_SECRET}" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            --data @/tmp/failed.json \
            || echo "WARNING: could not report the failure"

      - name: Commit ONLY the dedup ledger back to repo (never the comic content)
        if: always()
        run: |
          git config user.name "shadow-gasp-bot"
          git config user.email "bot@shadowgasp.example"
          # This repo is PUBLIC (for free Actions minutes). cases/ holds the
          # actual script, art, and finished PDF for a paid product — it must
          # NEVER be committed here, or anyone could download the comic free
          # straight from GitHub before it's even approved. Only the ledger
          # (case *names*, not content) is safe to keep in git history.
          # issues.json as well as the ledger. issue_registry.assign() WRITES this file when it
          # hands a new case its number, and nothing was committing it -- so every number
          # assigned in CI died with the runner. Operation Nimrod shipped as #04 with the
          # registry still topping out at 3, which means the next new case would have been
          # handed 4 as well: two books numbered #04, the number baked into each PDF and each
          # Gumroad title. Worse, once that second book recorded 4, a Nimrod REBUILD would
          # compute 5 -- a different script-cache key, so a fresh paid generation, a fingerprint
          # that no longer matches its art, and a reprint contradicting the issue already sold.
          git add cases_used.json issues.json
          git commit -m "Update case ledger: ${{ steps.case.outputs.case }}" || echo "nothing to commit"
          # Rebase before pushing: a push from a 3-hour build races anything committed to main
          # while it ran, and losing the ledger to a non-fast-forward is how a case gets built
          # twice.
          git pull --rebase --autostash origin main || true
          git push
          rm -rf cases/
