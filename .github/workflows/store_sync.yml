name: Store Sync (Gumroad storefront pages)

# Keeps shadowgasp.gumroad.com in the noir storefront design (pipeline_lib/store_design/):
#  - rebuilds the home page and /case-files-N whenever the published catalogue changes
#    (a comic published from Telegram shows up within the hour),
#  - gives any published comic still on the old landing template the new one.
# Pushes only what changed (store_design/state.json). Publication comes from the Gumroad API's
# `published` field, never from a page answering 200 -- drafts answer 200 too.
#
# Manual: cut_issues="54,55" cuts backdrop characters for existing comics from their committed
# carousel slides on this runner (never a laptop) and re-renders those comics' landing pages.

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      cut_issues:
        description: "Optional: issue numbers to cut backdrop characters for, e.g. 54,55,56"
        required: false
        default: ""
      dry_run:
        description: "Report what would change without publishing (true/false)"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: store-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: pip install Pillow numpy

      - name: Install character cutter
        if: github.event.inputs.cut_issues != ''
        run: pip install "rembg[cpu]" scipy rapidocr-onnxruntime

      - name: Install Gumroad CLI
        # Same guard as pipeline.yml: `curl | bash` reports success when the download fails.
        run: |
          set -o pipefail
          for attempt in 1 2 3 4 5; do
            curl -fsSL https://gumroad.com/install-cli.sh | bash && break
            echo "install attempt $attempt failed, retrying in $((attempt * 5))s"
            sleep $((attempt * 5))
          done
          test -x "$HOME/.local/bin/gumroad" || {
            echo "::error::Gumroad CLI did not install after 5 attempts"; exit 1; }

      - name: Authenticate Gumroad CLI
        run: echo "${{ secrets.GUMROAD_ACCESS_TOKEN }}" | ~/.local/bin/gumroad auth login --non-interactive

      - name: Sync storefront
        env:
          CUT_ISSUES: ${{ github.event.inputs.cut_issues }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          cd pipeline_lib
          ARGS=()
          [ -n "$CUT_ISSUES" ] && ARGS+=(--cut-issues "$CUT_ISSUES")
          [ "$DRY_RUN" = "true" ] && ARGS+=(--dry-run)
          python -m store_design.sync "${ARGS[@]}"

      - name: Commit sync state and new characters
        if: always()
        run: |
          git config user.name "shadow-gasp-bot"
          git config user.email "bot@shadowgasp.example"
          git add pipeline_lib/store_design/state.json pipeline_lib/store_design/chars/
          git commit -m "store sync: storefront state" || { echo "nothing to commit"; exit 0; }
          for attempt in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          echo "::error::could not push the sync state"; exit 1
